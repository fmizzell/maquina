version: 2.1
jobs:
  build:
    docker:
      - image: circleci/php:7.3
    environment:
      XDEBUG_MODE: coverage
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Run tests
          command: |
            composer install
            ./vendor/bin/phpunit --testsuite all --coverage-clover clover.xml
